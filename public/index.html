<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">

<title>Cairn — your whole-picture health OS</title>
<meta name="description" content="Self-hosted, connected health OS — reads your whole picture (training, food, labs, sleep, life) and suggests the one thing worth doing today.">
<meta name="application-name" content="Cairn">
<!-- theme-color follows the system palette: each scheme's ground. The light one equals the manifest's theme_color (scripts/bump-icons.mjs checks it). Light comes first: a browser that ignores media takes the first. -->
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#ebe7de">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121619">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow">
<meta name="format-detection" content="telephone=no">

<!-- iOS / standalone -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cairn">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<!-- Windows tile -->
<meta name="msapplication-TileColor" content="#ebe7de">
<meta name="msapplication-TileImage" content="/icons/icon-192.v3.png">

<!-- Icons. Filenames carry a version suffix (…vN) so a byte change ships under a
     NEW url — defeating the browser/OS install-layer icon cache (esp. iOS WebKit's
     apple-touch-icon cache, which keys on url). Bump it with scripts/bump-icons.mjs. -->
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="/icons/icon.v3.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.v3.png">
<link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.v3.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.v3.png">
<link rel="mask-icon" href="/icons/mask-icon.v3.svg" color="#b4552d">
<link rel="manifest" href="/manifest.json">

<!-- Social preview -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Cairn">
<meta property="og:title" content="Cairn — your whole-picture health OS">
<meta property="og:description" content="Self-hosted, connected health OS — reads your whole picture (training, food, labs, sleep, life) and suggests the one thing worth doing today.">
<meta property="og:image" content="/icons/og.v3.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Cairn — your whole-picture health OS">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Cairn — your whole-picture health OS">
<meta name="twitter:description" content="Self-hosted, connected health OS — reads your whole picture (training, food, labs, sleep, life) and suggests the one thing worth doing today.">
<meta name="twitter:image" content="/icons/og.v3.png">

<!-- Self-hosted type (public/fonts, OFL). Only the display and main UI faces are
     preloaded; the mono face arrives with the stylesheet. -->
<link rel="preload" href="/fonts/hanken-grotesk-latin-wght.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/young-serif-latin-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/styles.css">
<!-- Today's paint-critical reads start HERE, before the bundles parse: the aggregate,
     the Brief's read and the session preview, with the same token + zone headers
     api() sends. api() takes each Response once through CairnTodayPrefetch.takeEarly
     (src/client/today-data-loader.ts). Allowed by a CSP hash (src/earlyFetch.ts), so
     any edit here re-hashes itself at boot. -->
<script id="cairn-early-fetch">(function(){try{var p=location.pathname;if(p!=="/"&&p!=="/app"&&p!=="/app/"&&p!=="/app/today"&&p!=="/app/today/")return;var n=new Date(),z=function(v){return(v<10?"0":"")+v},d=n.getFullYear()+"-"+z(n.getMonth()+1)+"-"+z(n.getDate()),h={},t="",tz="";try{t=(localStorage.getItem("cairn_token")||"").trim()}catch(e){}if(t)h["X-Cairn-Token"]=t;try{tz=Intl.DateTimeFormat().resolvedOptions().timeZone||""}catch(e){}if(tz)h["X-Cairn-TZ"]=tz;var m={};["/today-read?date="+d+"&agent=auto","/daily-session/preview?date="+d,"/today?date="+d+"&surface=today"].forEach(function(q){m[q]={at:Date.now(),res:fetch("/api"+q,{headers:h,credentials:"same-origin"}).catch(function(){return null})}});window.__cairnEarly=m}catch(e){}})();</script>
</head>
<body>
  <header>
    <h1 id="header-title">Today</h1>
    <!-- One quiet, once-per-home line naming what moved here in the five-home
         navigation (src/client/app/moved-note.ts). Empty and hidden otherwise. -->
    <p id="movedNote" class="moved-note" hidden></p>
  </header>

  <main id="view"></main>

  <nav class="tabbar" aria-label="Primary">
    <a class="brand" href="/" aria-label="Cairn — home">
      <img class="brand-mark" src="/icons/icon.v3.svg" alt="" width="36" height="36">
      <span class="brand-text"><b>Cairn</b><small>Whole-picture health</small></span>
    </a>

    <button class="tab active" data-tab="today" aria-label="Today" aria-current="page">
      <svg class="tab-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="4.5" width="18" height="16.5" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4M9 15l2 2 4-4"/>
      </svg>
      <span class="tab-lbl">Today</span>
    </button>
    <button class="tab" data-tab="train" aria-label="Train">
      <svg class="tab-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="3 16 9 10 13 14 21 6"/><polyline points="15 6 21 6 21 12"/>
      </svg>
      <span class="tab-lbl">Train</span>
    </button>
    <button class="tab" data-tab="horizon" aria-label="Horizon">
      <svg class="tab-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M2.5 17h19M6.5 17a5.5 5.5 0 0 1 11 0M12 5.5v2.5M5.2 9.2l1.7 1.7M18.8 9.2l-1.7 1.7M7 20.5h10"/>
      </svg>
      <span class="tab-lbl">Horizon</span>
    </button>
    <button class="tab" data-tab="ask" aria-label="Ask">
      <svg class="tab-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 11.5a8.5 8.5 0 0 1-12.4 7.55L3 21l1.95-5.6A8.5 8.5 0 1 1 21 11.5Z"/>
      </svg>
      <span class="tab-lbl">Ask</span>
    </button>
    <button class="tab" data-tab="you" aria-label="You">
      <svg class="tab-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4.5 20.5c0-1.9 3.4-3 7.5-3s7.5 1.1 7.5 3M6.5 20.5h11"/><path d="M7.5 14.5c0-1.6 2-2.6 4.5-2.6s4.5 1 4.5 2.6-2 2.4-4.5 2.4-4.5-.8-4.5-2.4Z"/><path d="M9.3 8.6c0-1.3 1.2-2.1 2.7-2.1s2.7.8 2.7 2.1-1.2 2-2.7 2-2.7-.7-2.7-2Z"/>
      </svg>
      <span class="tab-lbl">You</span>
    </button>
  </nav>

  <!-- defer (not async) so parsing/first paint isn't blocked on ~1.5MB of JS while
       execution order is preserved exactly: defer scripts run, in document order,
       after parsing completes and before DOMContentLoaded — so art.js and the body-
       figure lib still finish before the feature bundles, and bundle-07's trailing
       startAppShell() call still runs dead last, same as the old synchronous order.

       Only the Today / You / Fuel shell loads here. Train (bundle-08), Horizon
       (bundle-09), Ask (bundle-10), Settings (bundle-11) and Health / About you
       (bundle-05) are deliberately ABSENT: they are injected on first navigation
       by ensureBundle (src/client/app/lazy-bundles.ts) and warmed on idle after the
       first paint. They stay in the service worker's CORE_ASSETS, so an installed
       PWA still precaches them and a first offline visit works. -->
  <script src="/art.js" defer></script>
  <script src="/cairn-body-figure.js" defer></script>
  <script src="/js/bundle-01-core.js" defer></script>
  <script src="/js/bundle-02-today.js" defer></script>
  <script src="/js/bundle-03-capture.js" defer></script>
  <script src="/js/bundle-04-coach-meals.js" defer></script>
  <script src="/js/bundle-07-boot.js" defer></script>
</body>
</html>
